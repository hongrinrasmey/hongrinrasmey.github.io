<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · [TODO: Your Name]</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">

  <!-- NOTE: this page uses addresses that start with "/" (like /css/style.css), because a hosting
       service can show it at any address, e.g. yoursite.com/some/missing/page.
       - On Netlify, Vercel, a custom domain, or GitHub Pages at username.github.io: works as is.
       - On GitHub Pages at username.github.io/REPO-NAME/: put /REPO-NAME in front of every "/" address below.
       - Opened by double-clicking the file it shows without styles. That is expected. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <script>
    (function () {
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.setAttribute('data-theme', t);
      d.classList.add('js');
    })();
  </script>

  <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Noto Sans Khmer (for Khmer text) is added by js/main.js only when the page has Khmer text. -->
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container header__inner">
      <a class="wordmark" href="/">[TODO: Your Name]</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch to light theme">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== PAGE NOT FOUND ===== -->
  <main id="main" tabindex="-1">
    <section class="container not-found" aria-labelledby="nf-title">
      <p class="section-label">Error 404</p> <!-- taste-skill-ignore: DESIGN.md §6.5 -->
      <h1 class="not-found__title" id="nf-title">Page not found</h1>
      <p class="not-found__text">This page doesn't exist or has moved. The home page has my work and how to reach me.</p>
      <a class="btn btn--primary" href="/">
        Back to home
        <svg class="btn__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container footer__inner">
      <p>&copy; <span id="year">2026</span> [TODO: Your Name]</p>
      <a class="footer__top" href="/">Home</a>
    </div>
  </footer>

  <script src="/js/main.js" defer></script>
</body>
</html>
