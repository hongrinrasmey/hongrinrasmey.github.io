  <meta name="color-scheme" content="dark light">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Sets the colour theme before the page draws, so it never flashes the wrong theme. -->
  <script>
    (function () {
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.setAttribute('data-theme', t);
      d.classList.add('js'); /* JavaScript is on: show the menu and theme buttons */
    })();
  </script>

  <!-- Fonts: Space Grotesk (headings), Inter (text), JetBrains Mono (labels).
       If you change them, also change the --font-... variables in css/style.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap">
