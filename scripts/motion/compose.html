<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo video scene</title>
<!-- Motion-graphics scene for the demo videos (VIDEOS.md §7). render.js loads this page,
     calls renderAt(t) for every frame and screenshots it. Every app screen shown is a real
     recorded frame; this page only adds the frame, camera moves, taps, cursor, captions and cards. -->
<style>
  @font-face { font-family: "Geist"; src: url("../../assets/fonts/geist-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 400 500; }
  :root { --bg: #0C0A09; --accent: #FF6B35; --text: #FAFAF9; --muted: #A8A29E; --line: rgba(255,255,255,.08); }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: var(--bg); overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Geist", Arial, sans-serif; }
  #grid { position: absolute; inset: -64px; background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 20%, transparent 72%); }
  #glow { position: absolute; width: 140%; aspect-ratio: 1; left: -20%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,53,.18) 0%, rgba(255,107,53,.05) 35%, transparent 65%); }
  #device { position: absolute; transform-origin: 50% 50%; will-change: transform, opacity; }
  .phone { border-radius: 64px; padding: 14px; background: #1C1917; border: 1.5px solid rgba(255,255,255,.12);
    box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.6) inset; }
  .phone #viewport { border-radius: 50px; }
  .browser { border-radius: 16px; background: #1C1917; border: 1.5px solid rgba(255,255,255,.12);
    box-shadow: 0 40px 140px rgba(0,0,0,.6); overflow: hidden; }
  /* neutral browser bar (no OS window buttons): just a centred address pill */
  #bar { display: none; height: 44px; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); }
  .browser #bar { display: flex; }
  #bar span { display: flex; align-items: center; justify-content: center; gap: 8px; width: 520px; height: 28px; border-radius: 14px;
    background: #292524; font: 400 15px/28px "Geist", Arial, sans-serif; color: var(--muted); white-space: nowrap; overflow: hidden; }
  #bar svg { flex: none; }
  #viewport { position: relative; overflow: hidden; background: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 0 0; }
  #screen { display: block; width: 100%; height: 100%; }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,.95);
    background: rgba(255,107,53,.35); box-shadow: 0 0 0 1px rgba(0,0,0,.25); transform: translate(-50%,-50%); }
  #cursor { position: absolute; left: 0; top: 0; display: none; transform-origin: 3px 2px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
  #caption { position: absolute; left: 50%; display: flex; align-items: center; gap: 14px; white-space: nowrap;
    padding: 18px 30px; border-radius: 18px; background: rgba(28,25,23,.92); border: 1px solid var(--line);
    box-shadow: 0 16px 48px rgba(0,0,0,.45); font-weight: 500; letter-spacing: -0.01em; }
  #caption::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
  #caption .tag { font: 500 .62em/1 "Geist Mono", monospace; letter-spacing: .06em; color: var(--accent);
    padding: 6px 9px; border: 1px solid rgba(255,107,53,.4); border-radius: 8px; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card h1 { font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; white-space: nowrap; }
  .card h1 span { display: inline-block; white-space: pre; }
  .label { font: 500 var(--lab, 22px)/1.4 "Geist Mono", monospace; color: var(--muted); letter-spacing: .02em; }
  .rule { width: 56px; height: 3px; border-radius: 2px; background: var(--accent); margin: 28px 0; }
  /* highlight: orange frame + label around one key thing, the rest of the screen dimmed */
  .hl { position: absolute; border: 3px solid var(--accent); border-radius: 12px; box-shadow: 0 0 0 4000px rgba(12,10,9,.5); }
  .hl b { position: absolute; left: -3px; white-space: nowrap; padding: .3em .6em; border-radius: 8px; background: var(--accent);
    color: #0C0A09; font: 600 1em/1.2 "Geist", Arial, sans-serif; }
  #caption .num { font: 500 .62em/1 "Geist Mono", monospace; color: var(--muted); letter-spacing: .04em; }
  #tagline { font-size: 34px; color: var(--muted); margin-top: 26px; letter-spacing: -0.01em; }
  #brand { position: absolute; left: 0; right: 0; text-align: center; font: 500 22px "Geist Mono", monospace; color: var(--muted); }
  #brand b { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="device"><div id="bar"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><b id="url" style="font-weight:400"></b></span></div>
    <div id="viewport"><div id="cam"><img id="screen" alt=""><div id="ripples"></div><div id="hls"></div>
      <svg id="cursor" width="26" height="26" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#0C0A09" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div></div>
  <div id="caption"><span class="tag" id="ctag"></span><span id="ctext"></span><span class="num" id="cnum"></span></div>
  <div class="card" id="role"><p class="label" id="rtag" style="color:var(--accent);margin-bottom:18px"></p><h1 id="rtext"></h1></div>
  <div class="card" id="title"><p class="label" id="kicker" style="margin-bottom:20px"></p><h1 id="name"></h1><p id="tagline"></p></div>
  <div class="card" id="end"><h1 id="endName"></h1><div class="rule" id="rule"></div><p class="label" id="tags"></p></div>
  <p id="brand"><b>&gt;_</b> Hong Rinrasmey</p>
</div>
<script>
// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const expo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);            // --ease-out-expo
const inout = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const prog = (t, a, d) => clamp((t - a) / d);                        // 0..1 between a and a+d
const $ = id => document.getElementById(id);
const letters = (el, text) => { el.textContent = ''; for (const ch of text) { const s = document.createElement('span'); s.textContent = ch; el.appendChild(s); } };

let C, segs, contentEnd, total, cams;
// init(config): lays out the stage once. Returns the total length in seconds.
window.init = cfg => {
  C = cfg;
  // recorded frames: f_00001.jpg = source time 0, one file per 1/fps second
  C.frameUrl = s => `${C.frames}/f_${String(clamp(Math.floor(s * C.fps) + 1, 1, C.nFrames)).padStart(5, '0')}.jpg`;
  const s = $('stage'); s.style.width = C.W + 'px'; s.style.height = C.H + 'px';
  const d = C.device, dev = $('device'), vp = $('viewport');
  dev.className = d.type;
  vp.style.width = d.sw + 'px'; vp.style.height = d.sh + 'px';
  const pad = d.type === 'phone' ? 14 : 0, bar = d.type === 'browser' ? 44 : 0;
  d.ow = d.sw + 2 * pad + 3; d.oh = d.sh + 2 * pad + bar + 3;      // outer size incl. 1.5px borders
  dev.style.left = (C.W - d.ow) / 2 + 'px'; dev.style.top = d.top + 'px';
  $('url').textContent = d.url || '';
  $('glow').style.top = (d.top + d.oh / 2 - C.W * .7) + 'px';
  const cap = $('caption'); cap.style.top = C.caption.y + 'px'; cap.style.fontSize = C.caption.size + 'px';
  $('kicker').textContent = C.title.kicker; letters($('name'), C.title.name); $('name').style.fontSize = C.title.size + 'px';
  letters($('endName'), C.title.name); $('endName').style.fontSize = C.end.size + 'px';
  $('tags').textContent = C.end.tags;
  $('tagline').textContent = C.title.tagline || '';
  $('rtext').style.fontSize = (C.roleSize || 72) + 'px'; $('role').style.opacity = 0;
  document.querySelectorAll('.label').forEach(e => e.style.setProperty('--lab', C.labelSize + 'px'));
  $('brand').style.bottom = C.brandBottom + 'px';
  $('cursor').setAttribute('width', 26 * (d.cursorScale || 1)); $('cursor').setAttribute('height', 26 * (d.cursorScale || 1));
  // segments: [srcStart, srcEnd, speed=1], laid end to end after the intro (hard cuts between them)
  let o = C.intro; segs = C.segments.map(([a, b, v = 1]) => { const g = { a, b, v, o, d: (b - a) / v }; o += g.d; return g; });
  contentEnd = o; total = contentEnd + C.outro;
  // camera keyframes: [srcTime, zoom, x, y, moveSeconds=.8] -> start moving at srcTime, arrive after moveSeconds
  cams = [{ t: 0, z: 1, x: d.srcW / 2, y: d.srcW * d.sh / d.sw / 2, m: 0 }]
    .concat((C.camera || []).map(([s, z, x, y, m = .8]) => ({ t: outNear(s), z, x, y, m })));
  return total;
};
// out time -> source time (holds the first / last frame outside the segments)
const srcAt = t => {
  if (t < segs[0].o) return segs[0].a;
  for (const g of segs) if (t < g.o + g.d) return g.a + (t - g.o) * g.v;
  return segs[segs.length - 1].b;
};
// source time -> out time (null if that moment was cut)
const outAt = s => { for (const g of segs) if (s >= g.a && s <= g.b) return g.o + (s - g.a) / g.v; return null; };
const outNear = s => { let best = segs[0].o; for (const g of segs) { if (s >= g.a && s <= g.b) return g.o + (s - g.a) / g.v; if (s > g.b) best = g.o + g.d; } return best; };
// logged mouse path -> cursor position at source time s
const cursorAt = s => {
  const p = C.cursor; if (!p.length || s < p[0].s) return p[0] || null;
  let i = 0; while (i < p.length - 1 && p[i + 1].s <= s) i++;
  const a = p[i], b = p[i + 1]; if (!b || b.s - a.s > .2) return a;
  const u = (s - a.s) / (b.s - a.s); return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
};
// camera at out time t: eased move from the previous keyframe's state to the current one
const camAt = t => {
  let prev = cams[0], cur = cams[0];
  for (let i = 1; i < cams.length; i++) if (cams[i].t <= t) { prev = cur; cur = cams[i]; }
  // "prev" must be the state we were holding when cur started
  let held = cams[0];
  for (let i = 1; i < cams.length && cams[i] !== cur; i++) held = cams[i];
  if (cur === cams[0]) return cur;
  const u = inout(prog(t, cur.t, cur.m));
  return { z: held.z + (cur.z - held.z) * u, x: held.x + (cur.x - held.x) * u, y: held.y + (cur.y - held.y) * u };
};

window.renderAt = async t => {
  const d = C.device, src = srcAt(t);
  // real recorded frame
  const img = $('screen'), url = C.frameUrl(src);
  if (img.dataset.u !== url) { img.src = url; img.dataset.u = url; await img.decode(); }

  // background: glow drifts, grid slides very slowly
  $('glow').style.transform = `translate(${Math.sin(t * .35) * 30}px, ${Math.cos(t * .27) * 24}px)`;
  $('grid').style.transform = `translate(${(t * 6) % 64}px, ${(t * 3) % 64}px)`;

  // intro title: kicker fades in, letters rise one by one, then everything lifts away
  const tout = inout(prog(t, C.intro - .75, .4));
  $('kicker').style.opacity = expo(prog(t, .05, .5)) * (1 - tout);
  [...$('name').children].forEach((sp, i) => {
    const u = expo(prog(t, .1 + i * .035, .6));
    sp.style.opacity = u; sp.style.transform = `translateY(${(1 - u) * 40}px)`;
  });
  const tg = expo(prog(t, .55, .6));
  $('tagline').style.opacity = tg; $('tagline').style.transform = `translateY(${(1 - tg) * 14}px)`;
  $('title').style.opacity = 1 - tout;
  $('title').style.transform = `translateY(${-tout * 60}px) scale(${1 - tout * .04})`;

  // role card ({at, tag, text}, source time): the screen dims for ~1.4s while "who is using it" shows
  let rk = 0;
  for (const r of C.roles || []) {
    const a = outNear(r.at);
    if (t >= a && t < a + 1.4) { rk = expo(prog(t, a, .3)) * (1 - inout(prog(t, a + 1.05, .35))); $('rtag').textContent = r.tag; $('rtext').textContent = r.text; }
  }
  $('role').style.opacity = rk;
  $('role').style.transform = `translateY(${(1 - rk) * 16}px)`;

  // device: slides up with a small 3D tilt, sways gently, leaves before the end card
  const din = expo(prog(t, C.intro - .4, 1.0)), dout = inout(prog(t, contentEnd + .35, .6));
  const float = Math.sin(t * 1.1) * (d.type === 'phone' ? 4 : 2);
  // cut punch: on each cut the screen starts 2% bigger and a touch brighter, and settles in .35s
  let punch = 0; for (const g of segs.slice(1)) if (t >= g.o) punch = 1 - expo(prog(t, g.o, .35));
  $('viewport').style.filter = punch > .01 ? `brightness(${1 + .1 * punch})` : '';
  $('device').style.opacity = clamp(din * 1.4) * (1 - dout) * (1 - .94 * rk);
  $('device').style.transform = `perspective(1600px) translateY(${(1 - din) * C.H * .35 + float - dout * 40}px)` +
    ` rotateX(${(1 - din) * 16}deg) rotateY(${Math.sin(t * .45) * (d.type === 'phone' ? 2.5 : 1)}deg)` +
    ` scale(${(.9 + .1 * din) * (1 - .06 * dout) * (1 + .02 * punch)})`;

  // camera: zoom + pan inside the screen, kept inside the screen edges
  const k = d.sw / d.srcW, cam = camAt(t), z = cam.z;
  const zx = cam.x * k, zy = cam.y * k;
  const tx = clamp(d.sw / 2 - zx * z, d.sw - d.sw * z, 0), ty = clamp(d.sh / 2 - zy * z, d.sh - d.sh * z, 0);
  $('cam').style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;

  // tap ripples (taps logged by the recording script, in source time)
  const rip = $('ripples'); rip.innerHTML = '';
  let press = 0;
  for (const p of C.taps) {
    const at = outAt(p.s); if (at === null) continue;
    const u = prog(src, p.s - .12, .55);                              // recording time: a ripple ends at a cut
    if (u > 0 && u < 1) {
      const r = document.createElement('div'); r.className = 'ripple';
      const size = (40 + 70 * expo(u)) * d.tapScale;
      Object.assign(r.style, { left: p.x * k + 'px', top: p.y * k + 'px', width: size + 'px', height: size + 'px', opacity: (1 - u) * .9 });
      rip.appendChild(r);
    }
    press = Math.max(press, 1 - Math.abs(t - at) / .15);            // cursor press around each click
  }

  // highlights {from, to, x, y, w, h, label?, below?, right?} in source time / source px: frame pops in, label slides in
  const hls = $('hls'); hls.innerHTML = '';
  for (const h of C.highlights || []) {
    const a = outNear(h.from), b = outNear(h.to); if (t < a || t > b) continue;
    const u = expo(prog(t, a, .4)), o = u * (1 - inout(prog(t, b - .3, .3))), pad = 1 + .12 * (1 - u);
    const el = document.createElement('div'); el.className = 'hl';
    const w = h.w * k * pad, hh = h.h * k * pad;
    Object.assign(el.style, { left: (h.x + h.w / 2) * k - w / 2 + 'px', top: (h.y + h.h / 2) * k - hh / 2 + 'px', width: w + 'px', height: hh + 'px', opacity: o,
      boxShadow: `0 0 0 4000px rgba(12,10,9,${.5 * o})` });
    if (h.label) {
      const lb = document.createElement('b'); lb.textContent = h.label;
      const lu = expo(prog(t, a + .2, .4));
      if (h.right) Object.assign(lb.style, { left: 'auto', right: '-3px' });   // label ends at the box's right edge
      Object.assign(lb.style, { fontSize: (C.hlSize || 22) / z + 'px', opacity: lu,
        [h.below ? 'top' : 'bottom']: `calc(100% + ${8 / z}px)`, transform: `translateY(${(h.below ? -1 : 1) * (1 - lu) * 10}px)` });
      el.appendChild(lb);
    }
    hls.appendChild(el);
  }

  // mouse cursor (web recordings only): tip of the arrow at the logged position, squeezes on click
  const cur = $('cursor'), cp = C.cursor && C.cursor.length ? cursorAt(src) : null;
  cur.style.display = cp ? 'block' : 'none';
  if (cp) cur.style.transform = `translate(${cp.x * k - 3}px, ${cp.y * k - 2}px) scale(${(1 - .18 * clamp(press)) / Math.sqrt(z)})`;

  // captions: {text, tag?, from, to} in source time; blur + rise in, fade out
  let cap = null, ck = 0, cin = 0;
  for (const c of C.captions) {
    const a = outNear(c.from), b = outNear(c.to);
    if (t >= a && t <= b) { cap = c; cin = expo(prog(t, a + .1, .6)); ck = cin * (1 - inout(prog(t, b - .3, .3))); }
  }
  const ce = $('caption');
  const ci = C.captions.indexOf(cap), cn = C.captions.length;
  $('cnum').textContent = cap ? `${String(ci + 1).padStart(2, '0')} / ${String(cn).padStart(2, '0')}` : '';
  if (cap) { $('ctext').textContent = cap.text; $('ctag').textContent = cap.tag || ''; $('ctag').style.display = cap.tag ? '' : 'none'; }
  ce.style.opacity = cap ? ck * (1 - rk) : 0;
  ce.style.filter = `blur(${(1 - cin) * 8}px)`;
  ce.style.transform = `translate(-50%, ${(1 - cin) * 18}px) scale(${.96 + .04 * cin})`;

  // end card: letters rise, accent rule draws, tags fade in
  const e0 = contentEnd + .7;
  [...$('endName').children].forEach((sp, i) => {
    const u = expo(prog(t, e0 + i * .03, .6)); sp.style.opacity = u; sp.style.transform = `translateY(${(1 - u) * 36}px)`;
  });
  $('rule').style.transform = `scaleX(${expo(prog(t, e0 + .35, .6))})`;
  $('tags').style.opacity = expo(prog(t, e0 + .55, .6));
  $('tags').style.transform = `translateY(${(1 - expo(prog(t, e0 + .55, .6))) * 12}px)`;
  $('brand').style.opacity = Math.max(expo(prog(t, .3, .6)) * (1 - tout), expo(prog(t, e0 + .7, .6))) * .9;
};
</script>
</body>
</html>
