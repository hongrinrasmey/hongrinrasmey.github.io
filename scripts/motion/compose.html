<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo video scene</title>
<!-- Motion-graphics scene for the demo videos (VIDEOS.md). render.js loads this page,
     calls renderAt(t) for every frame and screenshots it. Every app screen shown is a real
     recorded frame; this page only adds the frame, camera moves, taps, cursor, captions and cards.
     Style rule: the app is always the brightest, biggest thing on screen; one effect at a time. -->
<style>
  @font-face { font-family: "Geist"; src: url("../../assets/fonts/geist-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 400 500; }
  :root { --bg: #0C0A09; --surface: #1C1917; --accent: #FF6B35; --text: #FAFAF9; --muted: #A8A29E; --line: rgba(255,255,255,.09); }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: var(--bg); overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Geist", Arial, sans-serif; }
  #grid { position: absolute; inset: -64px; background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse at 50% 42%, #000 15%, transparent 70%); }
  #glow { position: absolute; width: 130%; aspect-ratio: 1; left: -15%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,53,.13) 0%, rgba(255,107,53,.04) 35%, transparent 62%); }
  #device { position: absolute; transform-origin: 50% 40%; will-change: transform, opacity; }
  /* Android phone: thin dark bezel + punch-hole camera, like the phone frames on the website */
  .phone { border-radius: 48px; padding: 10px; background: #0C0A09; border: 1.5px solid rgba(255,255,255,.16);
    box-shadow: 0 30px 90px rgba(0,0,0,.5); }
  .phone #viewport { border-radius: 38px; }
  .phone #hole { display: block; }
  #hole { display: none; position: absolute; left: 50%; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%;
    background: #0C0A09; box-shadow: 0 0 0 1.5px rgba(255,255,255,.06); z-index: 3; }
  .browser { border-radius: 14px; background: var(--surface); border: 1.5px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 100px rgba(0,0,0,.5); overflow: hidden; }
  /* neutral browser bar (no OS window buttons): just a centred address pill */
  #bar { display: none; height: 44px; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); }
  .browser #bar { display: flex; }
  #bar span { display: flex; align-items: center; justify-content: center; gap: 8px; width: 520px; height: 28px; border-radius: 14px;
    background: #292524; font: 400 15px/28px "Geist", Arial, sans-serif; color: var(--muted); white-space: nowrap; overflow: hidden; }
  #bar svg { flex: none; }
  #viewport { position: relative; overflow: hidden; background: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 0 0; }
  #screen { display: block; width: 100%; height: 100%; }
  /* tap: soft white ring, no colour flash */
  .ripple { position: absolute; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.95);
    background: rgba(255,255,255,.18); box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 2px 10px rgba(0,0,0,.18); transform: translate(-50%,-50%); }
  .click { position: absolute; border-radius: 50%; border: 2px solid var(--accent); transform: translate(-50%,-50%); }
  #cursor { position: absolute; left: 0; top: 0; display: none; transform-origin: 3px 2px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  /* caption bar: chapter number left, point + one-line explanation right; fixed place under the device */
  #caption { position: absolute; left: 50%; display: grid; grid-template-columns: auto 1fr; column-gap: 22px; align-items: center;
    padding: 20px 26px; border-radius: 20px; background: rgba(28,25,23,.94); border: 1px solid var(--line);
    box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  #cnum { font: 500 1em/1 "Geist Mono", monospace; color: var(--accent); letter-spacing: .02em; white-space: nowrap; align-self: start; padding-top: .18em; }
  #cnum i { font-style: normal; color: var(--muted); opacity: .7; }
  #ctitle { font-weight: 600; font-size: 1em; line-height: 1.2; letter-spacing: -0.015em; text-wrap: balance; }
  #csub { font-size: .72em; line-height: 1.35; color: var(--muted); margin-top: 6px; text-wrap: balance; }
  #ctag { display: inline-block; vertical-align: .18em; margin-left: 10px; font: 500 .5em/1 "Geist Mono", monospace; letter-spacing: .06em; color: var(--accent);
    padding: 5px 8px; border: 1px solid rgba(255,107,53,.4); border-radius: 7px; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 40px; }
  .card h1 { font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; white-space: nowrap; }
  .card h1 span { display: inline-block; white-space: pre; }
  .label { font: 500 var(--lab, 22px)/1.4 "Geist Mono", monospace; color: var(--muted); letter-spacing: .02em; }
  .rule { width: 56px; height: 3px; border-radius: 2px; background: var(--accent); margin: 28px 0; transform-origin: 50% 50%; }
  #tags span { display: inline-block; white-space: pre; }   /* pre: keeps the spaces around " · " */
  #cta { margin-top: 22px; font-size: var(--lab, 22px); color: var(--text); opacity: .85; }
  /* highlight: orange frame that draws itself around one key result, the rest of the screen softly dimmed */
  .blur { position: absolute; border-radius: 10px; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); background: rgba(232,240,236,.35); }
  .hl { position: absolute; border-radius: 12px; }
  .hl svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hl rect { fill: none; stroke: var(--accent); }
  .hl b { position: absolute; left: 0; white-space: nowrap; padding: .32em .65em; border-radius: 999px; background: var(--accent);
    color: #0C0A09; font: 600 1em/1.2 "Geist", Arial, sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  #tagline { font-size: 34px; color: var(--muted); margin-top: 26px; letter-spacing: -0.01em; text-wrap: balance; }
  #brand { position: absolute; left: 0; right: 0; text-align: center; font: 500 22px "Geist Mono", monospace; color: var(--muted); }
  #brand b { color: var(--accent); font-weight: 500; }
  #progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.06); }
  #progress i { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="device"><div id="bar"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><b id="url" style="font-weight:400"></b></span></div>
    <div id="viewport"><div id="hole"></div><div id="cam"><img id="screen" alt=""><div id="blurs"></div><div id="ripples"></div><div id="hls"></div>
      <svg id="cursor" width="26" height="26" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#0C0A09" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div></div>
  <div id="caption"><span id="cnum"></span><div><p id="ctitle"><span id="ctext"></span><span id="ctag"></span></p><p id="csub"></p></div></div>
  <div class="card" id="role"><p class="label" id="rtag" style="color:var(--accent);margin-bottom:18px"></p><h1 id="rtext"></h1></div>
  <div class="card" id="title"><p class="label" id="kicker" style="margin-bottom:20px"></p><h1 id="name"></h1><p id="tagline"></p></div>
  <div class="card" id="end"><h1 id="endName"></h1><div class="rule" id="rule"></div><p class="label" id="tags"></p><p id="cta"></p></div>
  <p id="brand"><b>&gt;_</b> Hong Rinrasmey</p>
  <div id="progress"><i id="bar-fill"></i></div>
</div>
<script>
// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const expo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);            // --ease-out-expo (entrances)
const out3 = x => 1 - Math.pow(1 - x, 3);                             // --ease-out (exits)
const smooth = x => x * x * x * (x * (6 * x - 15) + 10);              // smootherstep (camera)
const prog = (t, a, d) => clamp((t - a) / d);                        // 0..1 between a and a+d
const $ = id => document.getElementById(id);
const letters = (el, text) => { el.textContent = ''; for (const ch of text) { const s = document.createElement('span'); s.textContent = ch; el.appendChild(s); } };

// house timings (seconds), the same for every video
const T = { capIn: .3, capOut: .2, hlDraw: .45, hlOut: .25, chapterHold: 1.2, tap: .45 };

let C, segs, contentEnd, total, cams;
// init(config): lays out the stage once. Returns the total length in seconds.
window.init = cfg => {
  C = cfg; if (C.chapterHold != null) T.chapterHold = C.chapterHold;
  // recorded frames: f_00001.jpg = source time 0, one file per 1/fps second
  C.frameUrl = s => `${C.frames}/f_${String(clamp(Math.floor(s * C.fps) + 1, 1, C.nFrames)).padStart(5, '0')}.jpg`;
  const s = $('stage'); s.style.width = C.W + 'px'; s.style.height = C.H + 'px';
  const d = C.device, dev = $('device'), vp = $('viewport');
  dev.className = d.type;
  vp.style.width = d.sw + 'px'; vp.style.height = d.sh + 'px';
  // cover: a viewport with another shape than the recording (vertical cut of a desktop take) shows the
  // recording at full height and the camera picks which part; otherwise the recording fills the viewport
  d.srcH = d.srcH || d.srcW * d.sh / d.sw;
  d.k = d.cover ? d.sh / d.srcH : d.sw / d.srcW;
  d.iw = d.srcW * d.k; d.ih = d.srcH * d.k;
  $('screen').style.width = d.iw + 'px'; $('screen').style.height = d.ih + 'px';
  const pad = d.type === 'phone' ? 10 : 0, bar = d.type === 'browser' ? 44 : 0;
  d.ow = d.sw + 2 * pad + 3; d.oh = d.sh + 2 * pad + bar + 3;      // outer size incl. 1.5px borders
  dev.style.left = (C.W - d.ow) / 2 + 'px'; dev.style.top = d.top + 'px';
  $('hole').style.top = (d.holeY || 25) + 'px';
  $('url').textContent = d.url || '';
  $('glow').style.top = (d.top + d.oh / 2 - C.W * .65) + 'px';
  const cap = $('caption'); cap.style.top = C.caption.y + 'px'; cap.style.fontSize = C.caption.size + 'px';
  cap.style.width = (C.caption.w || d.ow) + 'px';
  $('kicker').textContent = C.title.kicker; letters($('name'), C.title.name); $('name').style.fontSize = C.title.size + 'px';
  letters($('endName'), C.title.name); $('endName').style.fontSize = C.end.size + 'px';
  $('tags').innerHTML = ''; (C.end.tags || '').split(' · ').forEach((x, i) => {
    const sp = document.createElement('span'); sp.textContent = (i ? ' · ' : '') + x; $('tags').appendChild(sp); });
  $('cta').textContent = C.end.cta || '';
  $('tagline').textContent = C.title.tagline || '';
  $('rtext').style.fontSize = (C.roleSize || 72) + 'px'; $('role').style.opacity = 0;
  document.querySelectorAll('.label, #cta').forEach(e => e.style.setProperty('--lab', C.labelSize + 'px'));
  $('brand').style.bottom = C.brandBottom + 'px';
  $('cursor').setAttribute('width', 26 * (d.cursorScale || 1)); $('cursor').setAttribute('height', 26 * (d.cursorScale || 1));
  // segments: [srcStart, srcEnd, speed=1, holdAfter=0], laid end to end after the intro (hard cuts between them).
  // A segment where a caption starts gets a chapter hold first: its first frame stays still while the caption comes in.
  const starts = (C.captions || []).map(c => c.from);
  // "speed" (config, default 1) plays every segment faster and shortens its end hold; nothing is cut
  const sp = C.speed || 1;
  let o = C.intro; segs = C.segments.map(([a, b, v = 1, post = 0]) => {
    v *= sp; post /= sp;
    const pre = C.chapterHolds === false ? 0 : (starts.some(f => Math.abs(f - a) < .01) ? T.chapterHold : 0);
    const g = { a, b, v, o, pre, post, run: (b - a) / v }; g.d = pre + g.run + post; o += g.d; return g; });
  contentEnd = o; total = contentEnd + C.outro;
  // camera keyframes: [srcTime, zoom, x, y, moveSeconds=.9] -> start moving at srcTime, arrive after moveSeconds
  // (a keyframe on a segment's first frame starts with its chapter hold, so the hold never shows the old crop)
  cams = [{ t: 0, z: 1, x: d.srcW / 2, y: d.srcH / 2, m: 0 }]
    .concat((C.camera || []).map(([s, z, x, y, m = .9]) => ({ t: outStart(s), z, x, y, m })));
  // a keyframe on the first chapter's first frame is also the camera during the intro (no jump when it starts)
  if (cams[1] && cams[1].t <= segs[0].o) cams[0] = { ...cams[1], t: 0, m: 0 };
  return { total, poster: C.posterAt != null ? outNear(C.posterAt) : C.poster };
};
// out time -> source time (holds the first / last frame during chapter holds and end holds)
const srcAt = t => {
  if (t < segs[0].o) return segs[0].a;
  for (const g of segs) if (t < g.o + g.d) return g.a + clamp(t - g.o - g.pre, 0, g.run) * g.v;
  return segs[segs.length - 1].b;
};
const segAt = t => { for (let i = 0; i < segs.length; i++) if (t < segs[i].o + segs[i].d) return i; return segs.length - 1; };
// source time -> out time: inside the moving part of a segment (null if that moment was cut)
const outAt = s => { for (const g of segs) if (s >= g.a && s <= g.b) return g.o + g.pre + (s - g.a) / g.v; return null; };
const outNear = s => { let best = segs[0].o; for (const g of segs) { if (s >= g.a && s <= g.b) return g.o + g.pre + (s - g.a) / g.v; if (s > g.b) best = g.o + g.d; } return best; };
// start of a thing: a time at a segment's first frame means "from the start of its chapter hold"
const outStart = s => { for (const g of segs) if (Math.abs(s - g.a) < .01) return g.o; return outNear(s); };
// end of a thing: a time at (or just before) a segment's last frame means "until the end of its hold"
const outEnd = s => { for (const g of segs) if (s >= g.b - .1 && s <= g.b + .01) return g.o + g.d; return outNear(s); };
// logged mouse path -> cursor position at source time s (Catmull-Rom, so the path curves instead of zig-zagging)
const cursorAt = s => {
  const p = C.cursor; if (!p.length || s < p[0].s) return p[0] || null;
  let i = 0; while (i < p.length - 1 && p[i + 1].s <= s) i++;
  const a = p[i], b = p[i + 1]; if (!b || b.s - a.s > .2) return a;
  const p0 = p[i - 1] && a.s - p[i - 1].s <= .2 ? p[i - 1] : a, p3 = p[i + 2] && p[i + 2].s - b.s <= .2 ? p[i + 2] : b;
  const u = (s - a.s) / (b.s - a.s), u2 = u * u, u3 = u2 * u;
  const cr = (q0, q1, q2, q3) => .5 * (2 * q1 + (-q0 + q2) * u + (2 * q0 - 5 * q1 + 4 * q2 - q3) * u2 + (-q0 + 3 * q1 - 3 * q2 + q3) * u3);
  return { x: cr(p0.x, a.x, b.x, p3.x), y: cr(p0.y, a.y, b.y, p3.y) };
};
// camera at out time t: eased move from the state held before the current keyframe
const camAt = t => {
  // shortcut: assumes each move finishes before the next keyframe starts (configs keep moves apart)
  let i = 0; while (i < cams.length - 1 && cams[i + 1].t <= t) i++;
  if (!i) return cams[0];
  const cur = cams[i], held = cams[i - 1], u = smooth(prog(t, cur.t, cur.m));
  return { z: held.z + (cur.z - held.z) * u, x: held.x + (cur.x - held.x) * u, y: held.y + (cur.y - held.y) * u };
};

// clean = poster still: no highlights, no progress line
window.renderAt = async (t, clean) => {
  const d = C.device, src = srcAt(t), si = segAt(t), g = segs[si];
  // real recorded frame
  const img = $('screen'), url = C.frameUrl(src);
  if (img.dataset.u !== url) { img.src = url; img.dataset.u = url; await img.decode(); }

  // background: still glow, grid creeps almost imperceptibly
  $('grid').style.transform = `translate(${(t * 1.5) % 64}px, ${(t * .8) % 64}px)`;

  // intro title: kicker fades in, letters rise one by one, tagline follows, then everything lifts away
  const tout = out3(prog(t, C.intro - .6, .4));
  $('kicker').style.opacity = expo(prog(t, .05, .5)) * (1 - tout);
  [...$('name').children].forEach((sp, i) => {
    const u = expo(prog(t, .1 + i * .03, .6));
    sp.style.opacity = u; sp.style.transform = `translateY(${(1 - u) * 36}px)`;
  });
  const tg = expo(prog(t, .5, .6));
  $('tagline').style.opacity = tg; $('tagline').style.transform = `translateY(${(1 - tg) * 14}px)`;
  $('title').style.opacity = 1 - tout;
  $('title').style.transform = `translateY(${-tout * 40}px)`;

  // role card ({at, tag, text}, source time): the screen dims for ~1.6s while "who is using it" shows
  let rk = 0;
  for (const r of C.roles || []) {
    const a = outNear(r.at);
    if (t >= a && t < a + 1.6) { rk = expo(prog(t, a, .35)) * (1 - out3(prog(t, a + 1.25, .35))); $('rtag').textContent = r.tag; $('rtext').textContent = r.text; }
  }
  $('role').style.opacity = rk;
  $('role').style.transform = `translateY(${(1 - rk) * 14}px)`;

  // device: slides up once, then stays still (no sway: moving text is harder to read); leaves before the end card
  const din = expo(prog(t, C.intro - .45, 1.0)), dout = out3(prog(t, contentEnd + .3, .55));
  $('device').style.opacity = clamp(din * 1.4) * (1 - dout) * (1 - .9 * rk);
  $('device').style.transform = `translateY(${(1 - din) * C.H * .25 - dout * 30}px) scale(${(.94 + .06 * din) * (1 - .04 * dout)})`;


  // camera: zoom + pan inside the screen, kept inside the screen edges
  const k = d.k, cam = camAt(t), z = cam.z;
  const zx = cam.x * k, zy = cam.y * k;
  const tx = clamp(d.sw / 2 - zx * z, d.sw - d.iw * z, 0), ty = clamp(d.sh / 2 - zy * z, d.sh - d.ih * z, 0);
  $('cam').style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;

  // taps (logged by the recording script, source time): soft ring, only inside the segment it happened in
  const rip = $('ripples'); rip.innerHTML = '';
  let press = 0;
  for (const p of C.taps) {
    if (p.s < g.a - .2 || p.s > g.b + .15) continue;   // a tap just after the cut still shows during the hold
    const at = g.o + g.pre + (p.s - g.a) / g.v;
    const u = prog(t, at - .08, T.tap);
    if (u > 0 && u < 1) {
      const r = document.createElement('div'); r.className = C.cursor && C.cursor.length ? 'click' : 'ripple';
      const size = (34 + 56 * expo(u)) * d.tapScale;
      Object.assign(r.style, { left: p.x * k + 'px', top: p.y * k + 'px', width: size + 'px', height: size + 'px', opacity: (1 - out3(u)) * .95 });
      rip.appendChild(r);
    }
    press = Math.max(press, 1 - Math.abs(t - at) / .15);            // cursor press around each click
  }

  // blurs {from, to, x, y, w, h} (source time / px): hide personal details such as a signed-in username
  const bl = $('blurs'); bl.innerHTML = '';
  for (const b of C.blurs || []) {
    if (t < outStart(b.from) || t > outEnd(b.to)) continue;
    const el = document.createElement('div'); el.className = 'blur';
    Object.assign(el.style, { left: b.x * k + 'px', top: b.y * k + 'px', width: b.w * k + 'px', height: b.h * k + 'px' });
    bl.appendChild(el);
  }

  // highlights {from, to, x, y, w, h, label?, below?, right?} in source time / source px: frame draws itself, label follows
  const hls = $('hls'); hls.innerHTML = '';
  for (const h of clean ? [] : C.highlights || []) {
    const a = outNear(h.from), b = outEnd(h.to); if (t < a || t > b) continue;
    const u = expo(prog(t, a, T.hlDraw)), o = 1 - out3(prog(t, b - T.hlOut, T.hlOut));
    const el = document.createElement('div'); el.className = 'hl';
    const w = h.w * k, hh = h.h * k, sw = 3 / z;
    Object.assign(el.style, { left: h.x * k + 'px', top: h.y * k + 'px', width: w + 'px', height: hh + 'px', opacity: o,
      boxShadow: `0 0 0 4000px rgba(12,10,9,${.35 * u})` });
    el.innerHTML = `<svg><rect x="0" y="0" width="${w}" height="${hh}" rx="12" pathLength="100" stroke-width="${sw}"
      stroke-dasharray="100" stroke-dashoffset="${100 * (1 - u)}"/></svg>`;
    if (h.label) {
      const lb = document.createElement('b'); lb.textContent = h.label;
      const lu = expo(prog(t, a + .25, .4));
      if (h.right) Object.assign(lb.style, { left: 'auto', right: '0' });   // label ends at the box's right edge
      Object.assign(lb.style, { fontSize: (C.hlSize || 22) / z + 'px', opacity: lu,
        [h.below ? 'top' : 'bottom']: `calc(100% + ${10 / z}px)`, transform: `translateY(${(h.below ? -1 : 1) * (1 - lu) * 8}px)` });
      el.appendChild(lb);
    }
    hls.appendChild(el);
  }

  // mouse cursor (web recordings only): tip of the arrow at the logged position, squeezes on click
  const cur = $('cursor'), cp = C.cursor && C.cursor.length ? cursorAt(src) : null;
  cur.style.display = cp ? 'block' : 'none';
  if (cp) cur.style.transform = `translate(${cp.x * k - 3}px, ${cp.y * k - 2}px) scale(${(1 - .15 * clamp(press)) / Math.sqrt(z)})`;

  // captions: {text, sub?, tag?, from, to} in source time; fade + rise in (300ms), fade out (200ms)
  let cap = null, ck = 0, cin = 0;
  for (const c of C.captions) {
    const a = outStart(c.from), b = outEnd(c.to);
    if (t >= a && t <= b) { cap = c; cin = expo(prog(t, a + .05, T.capIn)); ck = cin * (1 - out3(prog(t, b - T.capOut, T.capOut))); }
  }
  const ce = $('caption');
  const ci = C.captions.indexOf(cap), cn = C.captions.length;
  if (cap) {
    $('cnum').innerHTML = `${String(ci + 1).padStart(2, '0')}<i> / ${String(cn).padStart(2, '0')}</i>`;
    $('ctext').textContent = cap.text; $('csub').textContent = cap.sub || ''; $('csub').style.display = cap.sub ? '' : 'none';
    $('ctag').textContent = cap.tag || ''; $('ctag').style.display = cap.tag ? '' : 'none';
  }
  ce.style.opacity = cap ? ck * (1 - rk) : 0;
  ce.style.transform = `translate(-50%, ${(1 - cin) * 12}px)`;

  // progress line at the very bottom: how much of the demo is left
  const pk = expo(prog(t, C.intro - .2, .5)) * (1 - out3(prog(t, contentEnd, .4)));
  $('progress').style.opacity = C.progress === false || clean ? 0 : pk;
  $('bar-fill').style.transform = `scaleX(${prog(t, C.intro, contentEnd - C.intro)})`;

  // end card: letters rise, accent rule draws, tags appear one by one, then the call to action
  const e0 = contentEnd + .55;
  [...$('endName').children].forEach((sp, i) => {
    const u = expo(prog(t, e0 + i * .03, .6)); sp.style.opacity = u; sp.style.transform = `translateY(${(1 - u) * 32}px)`;
  });
  $('rule').style.transform = `scaleX(${expo(prog(t, e0 + .35, .6))})`;
  [...$('tags').children].forEach((sp, i) => {
    const u = expo(prog(t, e0 + .55 + i * .1, .5)); sp.style.opacity = u; sp.style.transform = `translateY(${(1 - u) * 10}px)`;
  });
  const cu = expo(prog(t, e0 + .95, .6));
  $('cta').style.opacity = .85 * cu; $('cta').style.transform = `translateY(${(1 - cu) * 10}px)`;
  $('brand').style.opacity = Math.max(expo(prog(t, .3, .6)) * (1 - tout), expo(prog(t, e0 + 1.1, .6))) * .9;
};
</script>
</body>
