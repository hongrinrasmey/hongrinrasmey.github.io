<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo scene</title>
<!-- Promo video scene (MOTION.md + VIDEO_CONCEPTS.md). render.js loads this page, calls init(config) once,
     then renderAt(t) for every frame and screenshots the stage. Every app screen is a real recorded frame:
     this page only adds the frame, camera, spotlights, callouts, taps, cursor, text and cards.
     Rules: the app is the brightest thing on screen; one big move at a time; text never moves while it is read. -->
<style>
  @font-face { font-family: "Geist"; src: url("../assets/fonts/geist-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Geist Mono"; src: url("../assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 400 500; }
  @font-face { font-family: "Noto Sans Khmer"; src: url("fonts/noto-sans-khmer.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #0C0A09; --surface: #1C1917; --line: #292524; --text: #FAFAF9; --muted: #A8A29E; --brand: #FF6B35;
    --app: #0B7751; --ui: #238F6B; --sans: "Geist", "Noto Sans Khmer", Arial, sans-serif; --mono: "Geist Mono", "Noto Sans Khmer", monospace; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: var(--bg); overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; /* init() sets the real size */ overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }
  #grid { position: absolute; inset: -64px; background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 10%, transparent 72%); }
  #glow { position: absolute; width: 1500px; height: 1500px; border-radius: 50%; }
  /* device */
  #dwrap { position: absolute; inset: 0; perspective: 2200px; }
  #device { position: absolute; transform-origin: 50% 50%; will-change: transform, opacity; }
  .phone { border-radius: 50px; padding: 12px; background: #0C0A09; border: 1.5px solid rgba(255,255,255,.16); }
  .phone #viewport { border-radius: 38px; }
  .browser { border-radius: 14px; background: var(--surface); border: 1.5px solid rgba(255,255,255,.12); overflow: hidden; }
  #bar { display: none; height: 44px; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,.08); }
  .browser #bar { display: flex; }
  #bar span { display: flex; align-items: center; justify-content: center; gap: 8px; width: 520px; height: 28px; border-radius: 14px;
    background: #292524; font: 400 15px/28px var(--sans); color: var(--muted); }
  #viewport { position: relative; overflow: hidden; background: #fff; }
  #hole { display: none; position: absolute; left: 50%; top: 13px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%;
    background: #0C0A09; z-index: 5; }
  .phone #hole { display: block; }
  #cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #screen { display: block; position: absolute; left: 0; top: 0; }
  .blur { position: absolute; border-radius: 10px; backdrop-filter: blur(10px); background: rgba(232,240,236,.35); }
  .hole { position: absolute; }
  .spotline { position: absolute; overflow: visible; }
  .spotline rect { fill: none; stroke: var(--ui); }
  .ring { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  #cursor { position: absolute; left: 0; top: 0; display: none; transform-origin: 0 0; }
  #shadow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); }
  /* text */
  .line { display: block; }
  .wm { display: inline-block; overflow: hidden; vertical-align: top; padding: .04em .02em .16em; margin: -.04em -.02em -.16em; }
  .w { display: inline-block; white-space: pre; will-change: transform; }
  .key { position: relative; }
  .key i { position: absolute; left: .02em; right: .02em; bottom: .03em; height: .075em; border-radius: 99px; background: var(--ui); transform-origin: 0 50%; }
  #hook { position: absolute; left: 0; right: 0; top: 50%; text-align: center; font-weight: 650; letter-spacing: -0.03em; line-height: 1.08; font-size: 104px; }
  #glyph { position: relative; height: 170px; margin-bottom: 26px; font-size: 150px; font-weight: 600; letter-spacing: 0; }
  #glyph > span { position: absolute; left: 0; right: 0; top: 0; white-space: pre; }
  #glyph .kr { font-size: 1.55em; line-height: 0; vertical-align: -.04em; }
  #hookx { margin-top: 48px; height: 60px; position: relative; }
  .pill { display: inline-block; font: 500 24px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--text);
    padding: 12px 18px; border-radius: 999px; background: rgba(28,25,23,.92); border: 1.5px solid var(--ui); white-space: nowrap; }
  .dot { position: absolute; top: 22px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--ui); }
  #caption { position: absolute; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; text-wrap: balance; }
  .phonecap #caption { left: 160px; width: 680px; top: 540px; font-size: 64px; }
  .browsercap #caption { left: 192px; width: 1536px; top: 976px; font-size: 42px; }
  .browsercap #crow { display: flex; align-items: center; gap: 22px; }
  #cnum { font: 500 24px/1 var(--mono); color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
  #cnum b { color: var(--ui); font-weight: 500; }
  .phonecap #cnum { display: block; margin-bottom: 22px; }
  #csub { font-size: 30px; font-weight: 400; line-height: 1.35; color: var(--muted); letter-spacing: -0.005em; margin-top: 20px; max-width: 600px; text-wrap: pretty; }
  .browsercap #csub { font-size: 26px; margin-top: 10px; max-width: none; }
  #role { position: relative; flex: none; font: 500 22px/1 var(--mono); letter-spacing: .06em; padding: 11px 16px; border-radius: 999px;
    color: #fff; background: var(--rc, var(--app)); overflow: hidden; }
  #ctext { display: block; }
  #callouts { position: absolute; inset: 0; pointer-events: none; }
  .callout { position: absolute; max-width: 410px; white-space: normal; line-height: 1.35; border-radius: 22px; }
  .browsercap .callout { max-width: 620px; }
  .conn { position: absolute; height: 2px; background: var(--ui); transform-origin: 0 50%; }
  .cdot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--ui); box-shadow: 0 0 0 3px rgba(12,10,9,.6); }
  #tl { position: absolute; left: 210px; width: 520px; height: 120px; }
  #tl .base { position: absolute; left: 0; right: 0; top: 29px; height: 2px; background: rgba(255,255,255,.18); transform-origin: 0 50%; }
  #tl .st { position: absolute; top: 52px; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  #tl .st b { display: block; font: 600 26px/1.2 var(--sans); }
  #tl .st small { display: block; font: 500 21px/1.4 var(--mono); color: var(--muted); }
  #textbeat { position: absolute; left: 160px; top: 50%; font-size: 84px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.12; }
  #textbeat .line { white-space: nowrap; }
  #panels { position: absolute; inset: 0; display: none; }
  .panel { position: absolute; top: 300px; width: 740px; }
  .panel .scr { position: relative; width: 740px; height: 416px; border-radius: 14px; overflow: hidden; border: 1.5px solid rgba(255,255,255,.14); background: #fff; }
  .panel .scr img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .panel .pill { margin-bottom: 22px; border: 0; color: #fff; }
  #link { position: absolute; top: 508px; height: 2px; background: var(--ui); transform-origin: 0 50%; }
  #check { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--app);
    display: grid; place-items: center; box-shadow: 0 0 0 8px var(--bg); }
  #outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 60px; }
  #oname { font-size: 124px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; }
  #oname .wd { display: inline-block; white-space: nowrap; }
  #oname .ch { display: inline-block; white-space: pre; }
  /* portrait (phones, 1080x2340): captions on top, device centred, labels inside the screen */
  .portrait #caption { left: 72px !important; width: 936px !important; top: 150px !important; }
  .portrait #crow { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .portrait #cnum { display: block; flex-basis: 100%; margin-bottom: 4px; font-size: 30px; }
  .portrait #role { font-size: 28px; }
  .portrait #ctext { font-size: 64px; }
  .portrait #csub, .portrait.browsercap #csub { font-size: 38px; max-width: none; margin-top: 18px; }
  .portrait .pill { font-size: 34px; }
  .portrait .callout { max-width: 860px; }
  .portrait #textbeat { left: 0; right: 0; text-align: center; }
  .portrait #oname { font-size: 104px; padding: 0 60px; }
  .portrait #ovalue { font-size: 36px; max-width: 900px; }
  .portrait #tl .st b { font-size: 32px; } .portrait #tl .st small { font-size: 26px; }
  #ovalue { margin-top: 22px; font-size: 38px; color: var(--muted); letter-spacing: -0.01em; }
  #orow { margin-top: 34px; display: flex; gap: 18px; align-items: center; font: 500 24px/1 var(--mono); color: var(--muted); letter-spacing: .03em; }
  #orow .tag { color: var(--text); padding: 10px 16px; border: 1.5px solid rgba(255,255,255,.28); border-radius: 10px; letter-spacing: .06em; }
  #octa { margin-top: 44px; font: 600 34px/1 var(--sans); color: #0C0A09; background: var(--brand); padding: 22px 40px; border-radius: 999px; letter-spacing: -0.01em; }
  #olink { margin-top: 20px; font: 400 24px/1.3 var(--mono); color: var(--muted); }
  #ofoot { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font: 600 28px/1.4 var(--sans); }
  #ofoot small { font: 400 24px var(--mono); color: var(--muted); margin-left: 14px; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="shadow"></div>
  <div id="dwrap"><div id="device"><div id="bar"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><b id="url" style="font-weight:400"></b></span></div>
    <div id="viewport"><div id="hole"></div><div id="cam"><img id="screen" alt=""><div id="blurs"></div><div id="spots"></div><div id="rings"></div>
      <svg id="cursor" width="26" height="26" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#0C0A09" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div></div></div>
  <div id="callouts"></div>
  <div id="caption"><div id="crow"><span id="cnum"></span><span id="role"><span id="rtext"></span></span><span id="ctext"></span></div><p id="csub"></p></div>
  <div id="tl"></div>
  <div id="textbeat"></div>
  <div id="hook"><div id="glyph"></div><div id="hlines"></div><div id="hookx"></div></div>
  <div id="panels"><div class="panel" id="pa"><span class="pill"></span><div class="scr"><img alt=""><div class="pb"></div></div></div>
    <div class="panel" id="pb"><span class="pill"></span><div class="scr"><img alt=""><div class="pb"></div></div></div>
    <div id="link"></div><div id="check"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>
  <div id="outro"><div id="oname"></div><p id="ovalue"></p><div id="orow"><span class="tag" id="otag"></span><span id="ometa"></span></div>
    <div id="octa"></div><p id="olink"></p></div>
  <p id="ofoot"></p>
</div>
<script>
const FPS = 30;
// ---------- easing (MOTION.md §6) ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const bez = (x1, y1, x2, y2) => x => {               // cubic-bezier(x1,y1,x2,y2) like CSS
  if (x <= 0) return 0; if (x >= 1) return 1;
  let t = x; for (let i = 0; i < 8; i++) { const c = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x;
    const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(d) < 1e-6) break; t = clamp(t - c / d); }
  return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; };
const outExpo = bez(.16, 1, .3, 1), inEase = bez(.7, 0, .84, 0), inOut = bez(.65, 0, .35, 1);
const spring = x => x <= 0 ? 0 : 1 - (1 + 8 * x) * Math.exp(-8 * x);   // critically damped (no bounce), ~1s to settle
const prog = (t, a, d) => clamp((t - a) / d);
const ss = u => u * u * (3 - 2 * u);
const $ = id => document.getElementById(id);
// text colour for a role pill: dark on light backgrounds, white on dark ones (contrast >= 4.5:1)
const fgFor = hex => { const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] > .18 ? '#0C0A09' : '#FFFFFF'; };
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

let C, D, beats, frames, total, hookEnd, outroStart, devIn;

// ---------- timeline ----------
// A clip beat plays one or more [srcStart, srcEnd, speed] pieces. Touching pieces form one run: the speed
// changes smoothly (ease over ~0.4 s), always inside the faster piece, so 1x parts play at real speed.
// A gap between pieces is a hard cut.
function clipFrames(clips) {
  const runs = []; let cur = [];
  clips.forEach((p, i) => { const q = { a: p[0], b: p[1], v: p[2] || 1 };
    if (cur.length && Math.abs(cur[cur.length - 1].b - q.a) > 1e-6) { runs.push(cur); cur = []; } cur.push(q); });
  runs.push(cur);
  const out = [];
  for (const run of runs) {
    const end = run[run.length - 1].b, R = .4;
    const vAt = s => {
      let i = run.findIndex(p => s < p.b); if (i < 0) i = run.length - 1;
      const p = run[i]; let v = p.v;
      const pv = run[i - 1], nx = run[i + 1];
      if (pv && pv.v < v) { const u = (s - p.a) / (R * (v + pv.v) / 2); if (u < 1) v = pv.v + (v - pv.v) * ss(clamp(u)); }
      if (nx && nx.v < v) { const u = (p.b - s) / (R * (v + nx.v) / 2); if (u < 1) v = Math.min(v, nx.v + (p.v - nx.v) * ss(clamp(u))); }
      return v; };
    for (let s = run[0].a; s < end - 1e-9; s += vAt(s) / FPS) out.push(s);
  }
  return out;
}

window.init = cfg => {
  C = cfg; D = C.device; const ph = D.type === 'phone';
  // C.tk[take] = { frames, nFrames, tapLines, tapOffset, tapShift } (render.js); a beat uses "take" or "main"
  C.frameUrl = (s, k = 'main') => `${C.tk[k].frames}/f_${String(clamp(Math.floor(s * FPS + 1e-6) + 1, 1, C.tk[k].nFrames)).padStart(5, '0')}.jpg`;
  const r = document.documentElement.style;
  r.setProperty('--app', C.app.accent); r.setProperty('--ui', C.app.ui);
  // layout: phone right of a text column, callouts right of the phone; browser wide with a caption row under it
  const stage = $('stage'), P = !!C.portrait; stage.className = (ph ? 'phonecap' : 'browsercap') + (P ? ' portrait' : '');
  C.W = P ? 1080 : 1920; C.H = P ? 2340 : 1080; stage.style.width = C.W + 'px'; stage.style.height = C.H + 'px';
  D.srcH = D.srcH || D.srcW * 9 / 16;
  if (ph) { D.sh = P ? 1440 : D.sh || 880; D.sw = Math.round(D.sh * D.srcW / D.srcH); D.pad = 12; D.bar = 0; }
  else if (P) { D.sw = 960; D.sh = 1500; D.pad = 0; D.bar = 44; D.cover = true; }   // a tall window into the desktop page
  else { D.sw = D.sw || 1536; D.sh = Math.round(D.sw * D.srcH / D.srcW); D.pad = 0; D.bar = 44; }
  D.k = D.cover ? D.sh / D.srcH : D.sw / D.srcW;
  D.ow = D.sw + 2 * D.pad + 3; D.oh = D.sh + 2 * D.pad + D.bar + 3;
  D.left = P ? Math.round((C.W - D.ow) / 2) : ph ? Math.round(1150 - D.ow / 2) : Math.round((1920 - D.ow) / 2);
  D.top = P ? (ph ? 600 : 560) : ph ? Math.round((1080 - D.oh) / 2) : 30;
  D.sx = D.left + 1.5 + D.pad; D.sy = D.top + 1.5 + D.pad + D.bar;      // screen origin on stage
  const dev = $('device'); dev.className = D.type;
  Object.assign(dev.style, { left: D.left + 'px', top: D.top + 'px' });
  Object.assign($('viewport').style, { width: D.sw + 'px', height: D.sh + 'px' });
  Object.assign($('cam').style, { width: D.srcW + 'px', height: D.srcH + 'px' });
  Object.assign($('screen').style, { width: D.srcW + 'px', height: D.srcH + 'px' });
  $('url').textContent = D.url || '';
  const cx = D.left + D.ow / 2, cy = D.top + D.oh / 2;
  Object.assign($('glow').style, { left: cx - 750 + 'px', top: cy - 750 + 'px',
    background: `radial-gradient(circle, ${C.app.glow}1A 0%, ${C.app.glow}0A 38%, transparent 66%)` });
  Object.assign($('shadow').style, { left: cx - D.ow * .55 + 'px', width: D.ow * 1.1 + 'px', top: D.top + D.oh - 30 + 'px', height: '80px' });
  if (!ph) { $('shadow').style.display = 'none'; if (!P) Object.assign($('caption').style, { top: D.top + D.oh + 26 + 'px', left: D.left + 'px', width: D.ow + 'px' }); }

  // taps + mouse path from the recording script's log ("seconds kind x y label")
  // tapShift [[loggedTime, offset]]: one tap whose screen change is further from its log time than the rest
  for (const T of Object.values(C.tk)) {
    const shift = s => (T.tapShift.find(q => Math.abs(q[0] - s) < .01) || [0, T.tapOffset])[1];
    T.taps = T.tapLines.filter(l => l.kind === 'tap').map(l => ({ s: l.s + shift(l.s), x: l.x, y: l.y }));
    T.path = T.tapLines.filter(l => l.kind === 'move').map(l => ({ s: l.s, x: l.x, y: l.y }));
  }

  // beats -> per-frame table { b: beat index, s: source time }
  beats = []; frames = [];
  const push = (b, s, k) => frames.push({ b, s, k });
  hookEnd = Math.round(C.hook.dur * FPS);
  const first = C.beats.find(b => b.clips), firstSrc = first.clips[0][0];
  for (let i = 0; i < hookEnd; i++) push(-1, firstSrc, first.take || 'main');
  let lastSrc = firstSrc, lastK = first.take || 'main';
  C.beats.forEach((b, bi) => {
    const g = Object.assign({ i: bi, start: frames.length, take: b.take || 'main' }, b); beats.push(g);
    if (b.clips) { const ss = clipFrames(b.clips); g.ss = ss; ss.forEach(s => push(bi, s, g.take));
      for (let k = 0; k < Math.round((b.hold || 0) * FPS); k++) push(bi, ss[ss.length - 1], g.take); lastSrc = ss[ss.length - 1]; lastK = g.take; }
    else { const n = Math.round(b.dur * FPS), next = C.beats.slice(bi + 1).find(x => x.clips);
      for (let k = 0; k < n; k++) { const nx = b.type === 'flip' && k >= n / 2 && next;
        push(bi, nx ? next.clips[0][0] : lastSrc, nx ? next.take || 'main' : lastK); } }
    g.end = frames.length;
  });
  outroStart = frames.length;
  for (let i = 0; i < Math.round(C.outro.dur * FPS); i++) push(-2, lastSrc, lastK);
  total = frames.length / FPS;
  devIn = beats.find(b => b.clips).start / FPS;
  // a hard cut (new beat or a jump in the recording): the screen settles from 1.2% bigger (frames[i].cut = frame of the last cut)
  let lc = -99; frames.forEach((f, i) => { const p = frames[i - 1];
    if (i && f.b >= 0 && beats[f.b].ss && (f.b !== p.b || Math.abs(f.s - p.s) > .5) && f.b !== beats.findIndex(b => b.clips)) lc = i; f.cut = lc; });
  // chapter numbers ("chapters": true): one per caption change
  let n = 0, last = null; beats.forEach(g => { if (g.caption && g.caption !== last) n++; if (g.caption) g.chap = n; last = g.caption || last; }); C.nChap = n;

  // static text
  buildHook(); buildOutro();
  return { total, poster: C.poster, frames: frames.length };
};

// source time -> output frame inside a clip beat (null if that moment was cut out)
function outOf(g, s) {
  if (!g.ss) return null;
  let lo = 0, hi = g.ss.length - 1; if (s < g.ss[0] - 1e-6 || s > g.ss[hi] + .5) return null;
  while (lo < hi) { const m = (lo + hi) >> 1; if (g.ss[m] < s) lo = m + 1; else hi = m; }
  if (g.ss[lo] - s > 2 / FPS) return null;                    // inside a hard cut
  return (g.start + lo) / FPS;
}

// ---------- text helpers ----------
// each word sits in its own mask, so a word rising in line 1 never shows through line 2
function words(host, text, key) {
  host.textContent = ''; const line = el('span', 'line'); host.appendChild(line);
  text.split(/(\s+)/).forEach(part => { if (!part) return;
    if (/^\s+$/.test(part)) { line.appendChild(document.createTextNode(' ')); return; }
    const m = el('span', 'wm'), w = el('span', 'w', part); m.appendChild(w); line.appendChild(m);
    if (key && part.replace(/[.,!]/g, '') === key) { m.classList.add('key'); m.appendChild(el('i')); } });
  return line;
}
const rise = (w, u) => { w.style.transform = `translateY(${(1 - u) * 112}%)`; };

function buildHook() {
  const H = C.hook, box = $('hlines'); box.textContent = ''; $('hook').style.fontSize = (C.portrait ? 84 : H.size || 104) + 'px';
  H.lines.forEach(l => { const d = el('div'); box.appendChild(d); words(d, l.text, l.key); });
  const gl = $('glyph'); gl.textContent = ''; gl.style.display = H.glyphs ? '' : 'none';
  // the riel sign draws much smaller than "$" in Noto Sans Khmer: scale it up to match
  (H.glyphs || []).forEach(g => { const s = el('span'); for (const ch of g) s.appendChild(ch === '៛' ? el('span', 'kr', ch) : document.createTextNode(ch)); gl.appendChild(s); });
  const x = $('hookx'); x.textContent = '';
  if (H.pills) { const row = el('div'); row.style.cssText = 'display:flex;gap:18px;justify-content:center';
    H.pills.forEach(p => { const s = el('span', 'pill', p); s.style.border = '0'; s.style.background = C.roles[p]; s.style.color = fgFor(C.roles[p]); row.appendChild(s); }); x.appendChild(row); }
  if (H.dots) { for (let i = 0; i < H.dots; i++) x.appendChild(el('span', 'dot')); x.style.width = '620px'; x.style.margin = '48px auto 0'; }
}
function buildOutro() {
  const O = C.outro, n = $('oname'); n.textContent = '';
  O.name.split(' ').forEach((w, i) => { if (i) n.appendChild(document.createTextNode(' ')); const wd = el('span', 'wd');
    for (const ch of w) wd.appendChild(el('span', 'ch', ch)); n.appendChild(wd); });
  $('ovalue').textContent = O.value; $('otag').textContent = O.platform; $('ometa').textContent = O.meta || '';
  $('octa').textContent = O.cta; $('olink').textContent = O.link || '';
  $('ofoot').innerHTML = ''; $('ofoot').append('Hong Rinrasmey', el('small', null, 'hongrinrasmey.github.io/portfolio'));
}

// ---------- per-frame pieces ----------
function renderHook(t) {
  const H = C.hook, on = t < H.dur + .05, hk = $('hook'); hk.style.display = on ? '' : 'none'; if (!on) return;
  const exit = inEase(prog(t, H.dur - .4, .4));
  hk.style.transform = `translateY(calc(-50% - ${exit * 40}px))`; hk.style.opacity = 1 - exit;
  [...$('hlines').children].forEach((d, i) => {
    const a = H.lines[i].at; [...d.querySelectorAll('.w')].forEach((w, j) => rise(w, outExpo(prog(t, a + j * .08, .5))));
    const key = d.querySelector('.key i'); if (key) key.style.transform = `scaleX(${outExpo(prog(t, a + .55, .5))})`; });
  if (H.glyphs) [...$('glyph').children].forEach((g, i) => {        // $ -> ៛ -> $ ៛ : blur + scale cross-morph
    const a = H.lines[i].at, nx = H.lines[i + 1] ? H.lines[i + 1].at : 99;
    const u = outExpo(prog(t, a - .05, .45)), o = inEase(prog(t, nx - .2, .25));
    g.style.opacity = u * (1 - o); g.style.filter = `blur(${(1 - u) * 14 + o * 14}px)`;
    g.style.transform = `scale(${.82 + .18 * u + .12 * o})`; });
  const x = $('hookx');
  if (H.pills) [...x.firstChild.children].forEach((p, i) => { const u = outExpo(prog(t, H.extraAt + i * .12, .5));
    p.style.opacity = u; p.style.transform = `translateY(${(1 - u) * -24}px)`; p.style.display = 'inline-block'; });
  if (H.dots) [...x.children].forEach((d, i) => {                  // dots space themselves out, gaps growing
    const u = inOut(prog(t, H.extraAt, 1.1)), pos = [0, .12, .32, .62, 1][i] ?? i / (H.dots - 1);
    d.style.left = (620 * (.5 + (pos - .5) * u)) + 'px'; d.style.opacity = outExpo(prog(t, H.extraAt - .2, .3)); });
}

function cameraAt(g, t) {
  // keyframes [srcTime, zoom, x, y, moveSeconds=.9]: start moving when the clip reaches srcTime
  const sp0 = (g.spots || [])[0];   // portrait window: starts on the beat's first highlight (or "px")
  const cxOf = sp => sp.cx ?? sp.x + sp.w / 2;   // "cx": where the portrait window centres for a highlight wider than it
  let st = { z: 1, x: g.px ?? (D.cover && sp0 ? cxOf(sp0) : D.srcW / 2), y: D.srcH / 2 };
  // portrait window with no camera of its own: glide to each later highlight as it appears
  const kfs = g.cam || (D.cover ? (g.spots || []).slice(1).map(sp => [sp.from, 1, cxOf(sp), D.srcH / 2, .7]) : []);
  for (const kf of kfs) {
    const o = outOf(g, kf[0]); if (o == null) continue; if (t < o) break;
    const u = inOut(prog(t, o, kf[4] || .9)), to = { z: kf[1], x: kf[2], y: kf[3] };
    st = { z: st.z + (to.z - st.z) * u, x: st.x + (to.x - st.x) * u, y: st.y + (to.y - st.y) * u };
  }
  const s = D.k * st.z;
  const tx = clamp(D.sw / 2 - st.x * s, D.sw - D.srcW * s, 0), ty = clamp(D.sh / 2 - st.y * s, D.sh - D.srcH * s, 0);
  return { s, tx, ty, z: st.z };
}

function blursInto(host, src, k = 'main') {
  host.textContent = '';
  for (const b of C.blurs || []) if ((b.take || 'main') === k && src >= b.from && src <= b.to) {
    const d = el('div', 'blur'); Object.assign(d.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' }); host.appendChild(d); }
}

function renderSpots(g, t, cam, clean) {
  const host = $('spots'), co = $('callouts'); host.textContent = ''; co.textContent = '';
  if (!g || !g.spots || clean) return;
  const settled = t > devIn + 1;
  for (const sp of g.spots) {
    const a = outOf(g, sp.from); if (a == null) continue;
    const bEnd = g.end / FPS, b = sp.to != null ? (outOf(g, sp.to) ?? bEnd) : bEnd;
    if (t < a || t > b) continue;
    const din = outExpo(prog(t, a, .4)), dout = 1 - inEase(prog(t, b - .3, .3)), k = din * dout;
    const pad = 10, r = (sp.r ?? 16);
    const hole = el('div', 'hole'), x = sp.x - pad, y = sp.y - pad, w = sp.w + 2 * pad, h = sp.h + 2 * pad;
    Object.assign(hole.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', borderRadius: r + 'px',
      boxShadow: `0 0 0 40000px rgba(12,10,9,${(.55 * k).toFixed(3)})` });
    host.appendChild(hole);
    const sw = 3 / cam.s, svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'spotline');
    Object.assign(svg.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    svg.innerHTML = `<rect x="0" y="0" width="${w}" height="${h}" rx="${r}" pathLength="1" stroke-width="${sw}" stroke-dasharray="1 1" stroke-dashoffset="${1 - outExpo(prog(t, a + .05, .55))}" opacity="${dout}"/>`;
    host.appendChild(svg);
    if (!sp.label || !settled) continue;
    // callout: phone -> pill right of the phone + connector; browser -> pill under (or over) the spot
    const L = { x: D.sx + cam.tx + x * cam.s, y: D.sy + cam.ty + y * cam.s, w: w * cam.s, h: h * cam.s };
    const scr = { x: D.sx, y: D.sy, r: D.sx + D.sw, b: D.sy + D.sh };
    const u = outExpo(prog(t, a + .35, .5)), pill = el('span', 'pill callout', sp.label);
    pill.style.opacity = u * dout; co.appendChild(pill);
    const ph = pill.offsetHeight, pw = pill.offsetWidth;
    if (D.type === 'phone' && !C.portrait) {
      const edge = Math.min(L.x + L.w, scr.r - 6), cy = clamp(L.y + L.h / 2, Math.max(scr.y + 30, L.y + 10), Math.min(scr.b - 30, L.y + L.h - 10));
      const px = D.left + D.ow + 56, py = clamp(cy - ph / 2, 120, 1080 - 120 - ph);
      pill.style.left = px + 'px'; pill.style.top = py + 'px'; pill.style.transform = `translateX(${(1 - u) * 24}px)`;
      const len = px - edge, c = el('div', 'conn'); const ly = clamp(cy, py + 14, py + ph - 14);
      Object.assign(c.style, { left: edge + 'px', top: ly - 1 + 'px', width: len + 'px', transform: `scaleX(${outExpo(prog(t, a + .3, .45))})`, opacity: dout });
      const dt = el('div', 'cdot'); Object.assign(dt.style, { left: edge + 'px', top: ly + 'px', opacity: din * dout });
      co.append(c, dt);
    } else {
      if (sp.side === 'right') {                                   // tall spot: pill beside it, centred
        const px = Math.min(L.x + L.w + 16, scr.r - 16 - pw), py = clamp(L.y + L.h / 2 - ph / 2, scr.y + 16, scr.b - 16 - ph);
        pill.style.left = px + 'px'; pill.style.top = py + 'px'; pill.style.transform = `translateX(${(1 - u) * -14}px)`;
      } else {
        const below = sp.side !== 'above', px = clamp(L.x + (sp.dx || 0), scr.x + 16, scr.r - 16 - pw);
        const py = below ? Math.min(L.y + L.h + 14, scr.b - 16 - ph) : Math.max(L.y - 14 - ph, scr.y + 16);
        pill.style.left = px + 'px'; pill.style.top = py + 'px'; pill.style.transform = `translateY(${(1 - u) * (below ? -14 : 14)}px)`;
      }
    }
  }
}

function renderTaps(g, t, src, cam, clean) {
  const host = $('rings'); host.textContent = ''; const cur = $('cursor');
  cur.style.display = 'none'; if (!g || !g.ss || clean) return;
  const web = D.type === 'browser', T = C.tk[g.take];
  for (const tp of T.taps) {
    const o = outOf(g, tp.s); if (o == null) continue; const u = (t - o) / .55; if (u < 0 || u > 1) continue;
    const d = (web ? 30 + 44 * outExpo(u) : 40 + 64 * outExpo(u)) / cam.s, r = el('div', 'ring');
    Object.assign(r.style, { left: tp.x + 'px', top: tp.y + 'px', width: d + 'px', height: d + 'px', opacity: (1 - u) * .95,
      border: `${2.5 / cam.s}px solid ${web ? C.app.ui : 'rgba(255,255,255,.95)'}`, background: web ? 'transparent' : 'rgba(255,255,255,.16)' });
    host.appendChild(r);
  }
  if (web && T.path.length) {                                    // mouse cursor along the logged path (Catmull-Rom)
    const p = T.path; let i = p.findIndex(q => q.s > src); if (i < 0) i = p.length - 1; if (i < 1) i = 1;
    const P = j => p[clamp(j, 0, p.length - 1)], a = P(i - 1), b = P(i), uu = clamp((src - a.s) / Math.max(1e-3, b.s - a.s));
    const cr = (q0, q1, q2, q3) => .5 * (2 * q1 + (-q0 + q2) * uu + (2 * q0 - 5 * q1 + 4 * q2 - q3) * uu * uu + (-q0 + 3 * q1 - 3 * q2 + q3) * uu ** 3);
    const x = cr(P(i - 2).x, a.x, b.x, P(i + 1).x), y = cr(P(i - 2).y, a.y, b.y, P(i + 1).y);
    const press = T.taps.some(tp => src >= tp.s - .05 && src <= tp.s + .15);
    cur.style.display = 'block';
    cur.style.transform = `translate(${x - 3 / cam.s}px, ${y - 2 / cam.s}px) scale(${1.25 / cam.s * (press ? .86 : 1)})`;
  }
}

function renderCaption(t, fi) {
  const f = frames[fi], g = f.b >= 0 ? beats[f.b] : null, cap = $('caption'), ct = $('ctext');
  const text = g && g.caption, role = g && g.role;
  if (!text) { cap.style.opacity = 0; return; }
  const gs = g.start / FPS, ge = g.end / FPS;
  const prev = beats[g.i - 1], next = beats[g.i + 1];
  const same = b => b && b.caption === text;
  const a = same(prev) ? -9 : gs + (g.i === beats.findIndex(b => b.clips) ? .55 : .12);
  const out = same(next) ? 0 : inEase(prog(t, ge - .28, .28));
  if (ct.dataset.t !== text) { ct.dataset.t = text; words(ct, text);
    $('cnum').innerHTML = C.chapters ? `<b>${String(g.chap).padStart(2, '0')}</b> / ${String(C.nChap).padStart(2, '0')}` : '';
    $('cnum').style.display = C.chapters ? '' : 'none'; $('csub').textContent = g.sub || ''; $('csub').style.display = g.sub ? '' : 'none'; }
  [...ct.querySelectorAll('.w')].forEach((w, j) => rise(w, outExpo(prog(t, a + j * .045, .5))));
  const su = outExpo(prog(t, a + .3, .6)); $('csub').style.opacity = su; $('csub').style.transform = `translateY(${(1 - su) * 12}px)`;
  const cu = outExpo(prog(t, a, .5)); $('cnum').style.opacity = cu;
  cap.style.opacity = 1 - out;
  const rl = $('role'); rl.style.display = role ? '' : 'none';
  if (role) { $('rtext').textContent = role; rl.style.setProperty('--rc', C.roles[role]); rl.style.color = fgFor(C.roles[role]);
    rl.style.opacity = outExpo(prog(t, devIn, .5)); }
  if (D.type === 'phone' && !C.portrait) { cap.style.transform = `translateY(-50%)`; cap.style.top = (g.timeline ? 450 : 540) + 'px'; }
}

function renderTimeline(t, g) {
  const tl = $('tl'); const T = g && g.timeline; tl.style.display = T ? '' : 'none'; if (!T) return;
  const a = outOf(g, T.from), ge = g.end / FPS; if (a == null) return;
  if (tl.dataset.b !== String(g.i)) { tl.dataset.b = g.i; tl.textContent = ''; tl.appendChild(el('div', 'base'));
    T.stops.forEach(s => { const d = el('div', 'dot'); const st = el('div', 'st'); st.append(el('b', null, s[0]), el('small', null, s[1])); tl.append(d, st); }); }
  tl.style.top = (C.portrait ? D.top + D.oh + 40 : $('caption').getBoundingClientRect().bottom + (T.y || 44)) + 'px';   // under the caption (portrait: under the phone)
  if (C.portrait) tl.style.left = (C.W - 520) / 2 + 'px';
  const out = 1 - inEase(prog(t, ge - .28, .28)); tl.style.opacity = out;
  tl.querySelector('.base').style.transform = `scaleX(${outExpo(prog(t, a, .6))})`;
  const dots = tl.querySelectorAll('.dot'), sts = tl.querySelectorAll('.st');
  T.stops.forEach((s, i) => { const u = outExpo(prog(t, a + .25 + i * .22, .5)), x = 520 * T.pos[i];
    Object.assign(dots[i].style, { left: x + 'px', opacity: u, transform: `scale(${.4 + .6 * u})` });
    Object.assign(sts[i].style, { left: x + 'px', opacity: u, transform: `translate(-50%, ${(1 - u) * 10}px)` }); });
}

function renderTextBeat(t, g) {
  const tb = $('textbeat'); const on = g && g.type === 'text'; tb.style.display = on ? '' : 'none'; if (!on) return;
  if (tb.dataset.b !== String(g.i)) { tb.dataset.b = g.i; tb.textContent = ''; g.lines.forEach(l => { const d = el('div'); tb.appendChild(d); words(d, l); }); }
  const a = g.start / FPS, e = g.end / FPS, out = inEase(prog(t, e - .3, .3));
  tb.style.transform = `translateY(-50%)`; tb.style.opacity = 1 - out;
  [...tb.children].forEach((d, i) => d.querySelectorAll('.w').forEach((w, j) => rise(w, outExpo(prog(t, a + .2 + i * .42 + j * .05, .5)))));
}

function renderPanels(t, g) {
  const P = $('panels'), on = g && g.type === 'finale'; P.style.display = on ? 'block' : 'none'; if (!on) return;
  const a = g.start / FPS, e = g.end / FPS;
  const out = inEase(prog(t, e - .35, .35));
  const PT = C.portrait;   // portrait: panels stacked, the link runs down between them
  [['pa', g.a, 140], ['pb', g.b, 1040]].forEach(([id, p, x], i) => {
    const n = $(id), u = outExpo(prog(t, a + .4 + i * .15, .7));   // after the device has left (.45 s)
    if (PT) { n.style.left = '170px'; n.style.top = (i ? 1320 : 520) + (i ? 1 : -1) * (1 - u) * 60 + 'px'; }
    else { n.style.top = ''; n.style.left = x + (i ? 1 : -1) * (1 - u) * 60 + 'px'; }
    n.style.opacity = u * (1 - out);
    n.style.transform = PT ? 'none' : `perspective(2200px) rotateY(${(i ? -1 : 1) * 10 * u}deg)`;
    const pill = n.querySelector('.pill'); pill.textContent = p.role; pill.style.background = C.roles[p.role]; pill.style.color = fgFor(C.roles[p.role]);
    const img = n.querySelector('img'), url = C.frameUrl(p.src, p.take); if (img.dataset.u !== url) { img.src = url; img.dataset.u = url; }
    img.style.transform = `scale(${740 / D.srcW})`;
    const pb = n.querySelector('.pb'); pb.style.cssText = `position:absolute;left:0;top:0;width:${D.srcW}px;height:${D.srcH}px;transform-origin:0 0;transform:scale(${740 / D.srcW})`;
    blursInto(pb, p.src, p.take || 'main'); });
  const lu = inOut(prog(t, a + 1.0, .6)); const ln = $('link');
  if (PT) Object.assign(ln.style, { left: '539px', top: 520 + 70 + 418 + 'px', width: '2px', height: 1320 - 1008 + 'px', transformOrigin: '50% 0', transform: `scaleY(${lu})`, opacity: 1 - out });
  else Object.assign(ln.style, { left: 140 + 740 + 'px', width: 1040 - 880 + 'px', height: '2px', transformOrigin: '0 50%', transform: `scaleX(${lu})`, opacity: 1 - out, top: 300 + 58 + 208 + 'px' });
  const cu = outExpo(prog(t, a + 1.4, .5)); const ck = $('check');
  Object.assign(ck.style, { left: (PT ? 540 : 960) + 'px', top: (PT ? 1008 + 156 : 300 + 58 + 209) + 'px', opacity: cu * (1 - out), transform: `scale(${.6 + .4 * cu})` });
}

function renderOutro(t) {
  const a = outroStart / FPS, on = t >= a; $('outro').style.display = on ? '' : 'none'; $('ofoot').style.display = on ? '' : 'none';
  if (!on) return;
  const r = t - a;
  [...$('oname').querySelectorAll('.ch')].forEach((s, i) => { const u = outExpo(prog(r, .35 + i * .03, .6)); s.style.opacity = u; s.style.transform = `translateY(${(1 - u) * 40}px)`; });
  const fade = (id, at) => { const u = outExpo(prog(r, at, .6)); $(id).style.opacity = u; $(id).style.transform = `translateY(${(1 - u) * 18}px)`; };
  fade('ovalue', .75); fade('orow', .95); fade('octa', 1.15); fade('olink', 1.25); fade('ofoot', 1.4);
}

// ---------- one frame ----------
window.renderAt = async (t, clean) => {
  const fi = clamp(Math.round(t * FPS), 0, frames.length - 1), f = frames[fi], g = f.b >= 0 ? beats[f.b] : null, src = f.s;
  const img = $('screen'), url = C.frameUrl(src, f.k);
  if (img.dataset.u !== url) { img.src = url; img.dataset.u = url; await img.decode(); }
  $('grid').style.transform = `translate(${(t * 3) % 64}px, ${(t * 1.6) % 64}px)`;
  renderHook(t);

  // device: rises with a small 3D tilt that settles flat (spring, no bounce); flips for a role change; leaves for the finale/outro
  const dev = $('device');
  let op = 0, tr = '';
  if (t >= devIn) {
    const u = spring(t - devIn); op = clamp((t - devIn) / .35);
    tr = `translateY(${(1 - u) * 90}px) rotateX(${(1 - u) * 10}deg) rotateY(${(1 - u) * -12}deg) scale(${.96 + .04 * u})`;
  }
  let shade = 0;
  if (g && g.type === 'flip') {
    // ease-in-out on both halves: slow while edge-on, and the page darkens as it turns, so brightness
    // changes gradually (a fast edge-on pass made a one-frame brightness dip, like a flicker)
    const p = (t - g.start / FPS) / ((g.end - g.start) / FPS);
    const ang = p < .5 ? 90 * inOut(p * 2) : -90 * (1 - inOut((p - .5) * 2));
    shade = Math.sin(Math.abs(ang) * Math.PI / 180);
    tr += ` scale(${1 - .08 * shade}) rotateY(${ang}deg)`;
  }
  const leaveAt = (beats.find(b => b.type === 'finale') || { start: outroStart }).start / FPS;
  const lv = inEase(prog(t, leaveAt, .45)); op *= 1 - lv; tr += ` translateY(${lv * 40}px)`;
  dev.style.opacity = op; dev.style.transform = tr;
  $('shadow').style.opacity = op * spring(t - devIn) * .9;
  const blurOn = g && g.type === 'text' ? outExpo(prog(t, g.start / FPS, .5)) * (1 - inEase(prog(t, g.end / FPS - .35, .35))) : 0;
  $('viewport').style.filter = blurOn > .001 ? `blur(${14 * blurOn}px) brightness(${1 - .45 * blurOn})` : shade > .001 ? `brightness(${1 - .75 * shade})` : '';

  const cg = g && g.ss ? g : null;
  const cam = cg ? cameraAt(cg, t) : { s: D.k, tx: 0, ty: 0, z: 1 };
  const st = f.cut >= 0 ? .012 * (1 - outExpo(prog(t, f.cut / FPS, .4))) : 0, vx = D.sw / 2, vy = D.sh / 2;
  $('cam').style.transform = `translate(${vx}px, ${vy}px) scale(${1 + st}) translate(${-vx}px, ${-vy}px) translate(${cam.tx}px, ${cam.ty}px) scale(${cam.s})`;
  blursInto($('blurs'), src, f.k);
  renderSpots(cg, t, cam, clean);
  renderTaps(cg, t, src, cam, clean);
  renderCaption(t, fi);
  renderTimeline(t, cg);
  renderTextBeat(t, g);
  renderPanels(t, g);
  renderOutro(t);
  await Promise.all([...document.images].filter(i => i.src && !i.complete).map(i => i.decode().catch(() => {})));
};

// preview (render.js --preview): scrub slider + play, for checking a cut before rendering
window.preview = () => {
  const bar = el('div'); bar.style.cssText = 'position:fixed;left:0;right:0;top:' + C.H + 'px;height:60px;display:flex;gap:12px;align-items:center;padding:0 16px;background:#111;color:#ccc;font:14px monospace';
  const play = el('button', null, 'play'), r = el('input'), lab = el('span');
  r.type = 'range'; r.min = 0; r.max = total; r.step = 1 / FPS; r.value = 0; r.style.flex = 1;
  bar.append(play, r, lab); document.body.appendChild(bar); document.body.style.overflow = 'visible';
  const show = async v => { lab.textContent = (+v).toFixed(2) + ' / ' + total.toFixed(2) + ' s'; await renderAt(+v); };
  r.oninput = () => show(r.value);
  let on = false; play.onclick = () => { on = !on; play.textContent = on ? 'pause' : 'play';
    const t0 = performance.now() - r.value * 1000;
    const loop = async () => { if (!on) return; const v = (performance.now() - t0) / 1000; if (v > total) { on = false; play.textContent = 'play'; return; }
      r.value = v; await show(v); requestAnimationFrame(loop); }; loop(); };
  show(0);
};
</script>
