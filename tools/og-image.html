<!doctype html>
<!--
  og-image.html — the picture shown when someone shares your site link (1200 × 630).
  1. Change the name and role below.
  2. Make the PNG again with Microsoft Edge (run in PowerShell from the project folder):
     & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --window-size=1200,630 --screenshot="$PWD\assets\images\og-image.png" "$PWD\tools\og-image.html"
     (Or open this file in a browser at 1200 × 630 and take a screenshot.)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
    background: #0A0A0A; color: #FAFAFA;
    font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  }
  .mark { width: 56px; height: 56px; border-radius: 12px; background: #C6F432; }
  h1 { margin: 0; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; font-weight: 700; }
  p  { margin: 24px 0 0; font-size: 40px; color: #A1A1AA; font-family: "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
  <div class="mark"></div>
  <div>
    <h1>[TODO: Your Name]</h1>
    <p>[TODO: Your Role]</p>
  </div>
</body>
</html>
