<!doctype html>
<!-- icon.html — turns favicon.svg into the PNG icons.
     Note: new Edge can't open a window this small, so these lines may give a plain orange square.
     If so, ask the agent to draw the icons with Python Pillow (same design: dark rounded square, orange ">_" prompt).
     After changing favicon.svg, run these two lines in PowerShell from the project folder:
     & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --window-size=180,180 --screenshot="$PWD\apple-touch-icon.png" "$PWD\tools\icon.html"
     & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --window-size=32,32 --screenshot="$PWD\favicon-32.png" "$PWD\tools\icon.html" -->
<html lang="en"><head><meta charset="utf-8"><title>icon</title>
<style>html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#FF6B35}img{display:block;width:100vw;height:100vh}</style>
</head><body><img src="../favicon.svg" alt=""></body></html>
