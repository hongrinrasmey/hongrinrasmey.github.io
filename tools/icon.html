<!doctype html>
<!-- icon.html — turns favicon.svg into favicon.png (180 × 180, used by phones and old browsers).
     After changing favicon.svg, run in PowerShell from the project folder:
     & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --window-size=180,180 --screenshot="$PWD\favicon.png" "$PWD\tools\icon.html" -->
<html lang="en"><head><meta charset="utf-8"><title>icon</title>
<style>html,body{margin:0;width:180px;height:180px;overflow:hidden;background:#0A0A0A}img{display:block;width:180px;height:180px}</style>
</head><body><img src="../favicon.svg" alt=""></body></html>
